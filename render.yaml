services:
  - type: web
    name: fic-voice-crm
    env: python
    region: singapore
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_DB_NAME
        value: ai_voice_crm
      - key: VAPI_BASE_URL
        value: https://api.vapi.ai
